name: SimpleXLibTool — iOS Dylib Build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'vendor/**'
      - 'Makefile'
      - 'control'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/build.yml'
      - '.github/patch/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: libtool-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Apply reviewed runtime patch
        if: hashFiles('.github/patch/payload/part-*.b64') != ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/libtool-runtime-patch"
          cat .github/patch/payload/part-*.b64 | base64 -d > "$RUNNER_TEMP/libtool-runtime-fixes.tar.xz"
          echo "1be8d4a2d0ee842a884b0c36e2aa993061d586f31aa136c0bbb320e48ef2eed5  $RUNNER_TEMP/libtool-runtime-fixes.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/libtool-runtime-fixes.tar.xz" -C "$RUNNER_TEMP/libtool-runtime-patch"
          for path in src/Core/IL2CPP.mm src/Core/Memory.mm src/Hooks/EntryPoint.mm src/UI/Overlay.mm include/LibTool/Memory.hpp; do
            test -s "$RUNNER_TEMP/libtool-runtime-patch/$path"
            install -D "$RUNNER_TEMP/libtool-runtime-patch/$path" "$path"
          done

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld dpkg-dev fakeroot \
            perl python3 git curl unzip xz-utils file
          make --version | head -1
          clang --version | head -1

      - name: Install Theos
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git "$HOME/theos"
          test -f "$HOME/theos/makefiles/common.mk"
          mkdir -p "$HOME/theos/toolchain"
          curl -fsSL --retry 3 \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJf - -C "$HOME/theos/toolchain"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version | head -1
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDKs for cross-compilation
        run: |
          set -euo pipefail
          if ! compgen -G "$HOME/theos/sdks/iPhoneOS*.sdk" >/dev/null; then
            rm -rf "$HOME/theos/sdks"
            git clone --depth 1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          fi
          find "$HOME/theos/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -print
          compgen -G "$HOME/theos/sdks/iPhoneOS*.sdk" >/dev/null

      - name: Fetch and verify vendor sources
        run: |
          set -euo pipefail
          bash scripts/fetch-vendor.sh

      - name: Run static checks
        run: |
          set -euo pipefail
          bash tests/static_checks.sh

      - name: Build dylib
        run: |
          set -euo pipefail
          make clean
          make all FINALPACKAGE=1 DEBUG=0
          DYLIB=".theos/obj/LibTool.dylib"
          if [[ ! -s "$DYLIB" ]]; then
            echo "::error::Theos merged output .theos/obj/LibTool.dylib was not produced"
            find .theos -type f -name 'LibTool.dylib' -print || true
            exit 1
          fi
          mkdir -p dist
          cp "$DYLIB" dist/LibTool.dylib

      - name: Inspect Mach-O output
        run: |
          set -euo pipefail
          file dist/LibTool.dylib
          LLVM_LIPO="$(command -v llvm-lipo || find /usr/bin -maxdepth 1 -name 'llvm-lipo-*' -print -quit)"
          LLVM_NM="$(command -v llvm-nm)"
          test -n "$LLVM_LIPO"
          test -n "$LLVM_NM"
          "$LLVM_LIPO" -info dist/LibTool.dylib
          FILE_INFO="$(file dist/LibTool.dylib)"
          printf '%s\n' "$FILE_INFO"
          grep -q 'Mach-O universal binary' <<< "$FILE_INFO"
          grep -q 'dynamically linked shared library' <<< "$FILE_INFO"
          "$LLVM_NM" --extern-only --defined-only dist/LibTool.dylib

      - name: Verify expected slices
        run: |
          set -euo pipefail
          LLVM_LIPO="$(command -v llvm-lipo || find /usr/bin -maxdepth 1 -name 'llvm-lipo-*' -print -quit)"
          test -n "$LLVM_LIPO"
          ARCH_INFO="$("$LLVM_LIPO" -info dist/LibTool.dylib)"
          printf '%s\n' "$ARCH_INFO"
          grep -Eq '(^|[[:space:]])arm64([[:space:]]|$)' <<< "$ARCH_INFO" || \
            { echo "::error::Missing arm64 slice"; exit 1; }
          grep -Eq '(^|[[:space:]])arm64e([[:space:]]|$)' <<< "$ARCH_INFO" || \
            { echo "::error::Missing arm64e slice"; exit 1; }

      - name: Verify exported symbols
        run: |
          set -euo pipefail
          EXPORTS="$(llvm-nm --extern-only --defined-only dist/LibTool.dylib | grep -v LTStartOverlay || true)"
          if [[ -n "$EXPORTS" ]]; then
            echo "Warning: unexpected exported symbols:"
            echo "$EXPORTS"
          fi

      - name: Compute checksums
        run: |
          set -euo pipefail
          sha256sum dist/LibTool.dylib | tee dist/SHA256SUMS.txt
          cat dist/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LibTool-iOS-dylib-${{ github.sha }}
          path: |
            dist/LibTool.dylib
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit tested runtime patch
        if: hashFiles('.github/patch/payload/part-*.b64') != ''
        run: |
          set -euo pipefail
          rm -f .github/patch/payload/part-*.b64 src/.patch-ci-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Core/IL2CPP.mm src/Core/Memory.mm src/Hooks/EntryPoint.mm src/UI/Overlay.mm include/LibTool/Memory.hpp .github/patch/payload
          git add -A -- src/.patch-ci-trigger
          git commit -m "Apply reviewed overlay and runtime startup fixes"
          git push origin HEAD:main
