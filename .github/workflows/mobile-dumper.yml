name: MobileDumper-7 — Theos iOS Dylib

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/mobile-dumper.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-dumper-theos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build original MobileDumper-7 with Theos
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang llvm lld dpkg-dev fakeroot \
            perl python3 git curl unzip xz-utils file
          make --version | head -1

      - name: Install Theos
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          test -f "$HOME/theos/makefiles/common.mk"
          mkdir -p "$HOME/theos/toolchain"
          curl -fsSL --retry 3 \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz \
            | tar -xJf - -C "$HOME/theos/toolchain"
          test -x "$HOME/theos/toolchain/linux/iphone/bin/clang"
          "$HOME/theos/toolchain/linux/iphone/bin/clang" --version | head -1
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/toolchain/linux/iphone/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: |
          set -euo pipefail
          mkdir -p "$THEOS/sdks"
          if ! compgen -G "$THEOS/sdks/iPhoneOS*.sdk" >/dev/null; then
            SDK_SOURCE="$RUNNER_TEMP/theos-sdks"
            rm -rf "$SDK_SOURCE"
            git clone --depth 1 https://github.com/theos/sdks.git "$SDK_SOURCE"
            find "$SDK_SOURCE" -mindepth 1 -maxdepth 1 -type d -name 'iPhoneOS*.sdk' \
              -exec cp -a {} "$THEOS/sdks/" \;
          fi
          find "$THEOS/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -print
          compgen -G "$THEOS/sdks/iPhoneOS*.sdk" >/dev/null

      - name: Fetch the original source and submodules
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/MJx0/MobileDumper-7.git MobileDumper-7
          cd MobileDumper-7
          git submodule status --recursive
          test -s Theos/Makefile
          test -s Dumper/main_ios.mm
          test -s libs/KittyMemory/KittyMemory/MemoryPatch.cpp
          echo "Upstream revision: $(git rev-parse HEAD)"

      - name: Apply SDK and compiler compatibility fixes in the build workspace
        working-directory: MobileDumper-7
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("Dumper/Memory/MemoryiOS.mm")
          source_text = source.read_text()
          replacements = {
              "return [MainBundle.bundleIdentifier UTF8String];":
                  "return [MainBundle.bundleIdentifier cStringUsingEncoding:NSUTF8StringEncoding];",
              "return [[[NSProcessInfo processInfo] processName] UTF8String];":
                  "return [[[NSProcessInfo processInfo] processName] cStringUsingEncoding:NSUTF8StringEncoding];",
          }
          for old, new in replacements.items():
              count = source_text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              source_text = source_text.replace(old, new)
          source.write_text(source_text)

          generator_header = Path("Dumper/Generator/Generators/Generator.h")
          header_text = generator_header.read_text()
          include_anchor = "#include <filesystem>"
          if header_text.count(include_anchor) != 1:
              raise SystemExit("Could not safely locate the Generator.h include section")
          generator_header.write_text(header_text.replace(include_anchor, include_anchor + chr(10) + "#include <concepts>"))

          cpp_generator = Path("Dumper/Generator/Generators/CppGenerator.cpp")
          cpp_text = cpp_generator.read_text()
          cpp_replacements = {
              "const std::u8string U8FileName = reinterpret_cast<const std::u8string&>(FileName);": "",
              'U8FileName + u8"_classes.hpp"': 'FileName + "_classes.hpp"',
              'U8FileName + u8"_structs.hpp"': 'FileName + "_structs.hpp"',
              'U8FileName + u8"_parameters.hpp"': 'FileName + "_parameters.hpp"',
              'U8FileName + u8"_functions.cpp"': 'FileName + "_functions.cpp"',
          }
          for old, new in cpp_replacements.items():
              count = cpp_text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              cpp_text = cpp_text.replace(old, new)
          cpp_generator.write_text(cpp_text)

          makefile = Path("Theos/Makefile")
          make_text = makefile.read_text()
          old_flag = "-Wno-deprecated-declarations"
          new_flag = old_flag + " -Wno-ambiguous-reversed-operator -Wno-unknown-attributes -Wno-return-std-move -Wno-range-loop-construct"
          if make_text.count(old_flag) != 1:
              raise SystemExit("Could not safely locate the Makefile warning list")
          makefile.write_text(make_text.replace(old_flag, new_flag))

          Path("BUILD_PATCHES.txt").write_text(chr(10).join([
              "Build-local compatibility changes; upstream repository was not modified.",
              "- Use NSString cStringUsingEncoding:NSUTF8StringEncoding for the two process-name conversions because the selected SDK omits the legacy UTF8String declaration.",
              "- Disable Clang's ambiguous-reversed-operator diagnostic for the upstream UtfN.hpp iterator implementation under C++20.",
              "- Disable Clang 11 unknown-attribute warnings for C++20 likely/unlikely branch hints.",
              "- Include <concepts> directly where std::same_as is used.",
              "- Keep UTF-8 generated filenames in std::string form for this libc++ filesystem implementation.",
              "- Suppress non-fatal return-move and range-loop-copy diagnostics emitted as errors by this compiler."
          ]) + chr(10))
          PY
          git diff -- Dumper/Memory/MemoryiOS.mm Theos/Makefile

      - name: Build package with Theos
        working-directory: MobileDumper-7/Theos
        run: |
          set -euo pipefail
          make clean
          make package FINALPACKAGE=1 DEBUG=0
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          mkdir -p "$RUNNER_TEMP/md7-package"
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/md7-package"
          DYLIB="$(find "$RUNNER_TEMP/md7-package" -type f -name 'MobileDumper-7.dylib' -print -quit)"
          if [[ -z "$DYLIB" ]]; then
            echo "::error::Theos package did not contain MobileDumper-7.dylib"
            find "$RUNNER_TEMP/md7-package" -maxdepth 8 -type f -print
            exit 1
          fi
          mkdir -p ../dist
          cp "$DYLIB" ../dist/MobileDumper-7.dylib
          cp "$DEB" ../dist/
          git -C .. rev-parse HEAD > ../dist/UPSTREAM_COMMIT.txt
          cp ../BUILD_PATCHES.txt ../dist/BUILD_PATCHES.txt

      - name: Verify dylib architecture and Mach-O type
        working-directory: MobileDumper-7
        run: |
          set -euo pipefail
          file dist/MobileDumper-7.dylib
          llvm-lipo -info dist/MobileDumper-7.dylib
          file dist/MobileDumper-7.dylib | grep -q 'Mach-O'
          llvm-lipo -verify_arch arm64 dist/MobileDumper-7.dylib
          llvm-nm --extern-only --defined-only dist/MobileDumper-7.dylib > dist/EXPORTED_SYMBOLS.txt
          sha256sum dist/MobileDumper-7.dylib | tee dist/SHA256SUMS.txt

      - name: Upload dylib and Theos package
        uses: actions/upload-artifact@v4
        with:
          name: MobileDumper-7-Theos-iOS-arm64-${{ github.sha }}
          path: |
            MobileDumper-7/dist/MobileDumper-7.dylib
            MobileDumper-7/dist/*.deb
            MobileDumper-7/dist/SHA256SUMS.txt
            MobileDumper-7/dist/UPSTREAM_COMMIT.txt
            MobileDumper-7/dist/BUILD_PATCHES.txt
            MobileDumper-7/dist/EXPORTED_SYMBOLS.txt
          if-no-files-found: error
          retention-days: 14
